<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Meteor Shower</title>
<style>
body{
  margin:0;background:#000;display:flex;justify-content:center;
  align-items:center;height:100vh;overflow:hidden;font-family:"Courier New",monospace;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,0.03)0px,rgba(255,255,255,0.03)2px,
    rgba(0,0,0,0.05)2px,rgba(0,0,0,0.05)4px);
  z-index:10;
}
canvas{
  background:#000;border:4px solid #0ff;
  box-shadow:0 0 25px #0ff,0 0 50px #0ff inset;
}
@font-face{
  font-family:"PressStart";
  src:url("https://fonts.gstatic.com/s/pressstart2p/v9/e3t4euO8T-267oIAQAu6jDQyK3nY.ttf");
}
</style>
</head>
<body>
<canvas id="game" width="500" height="700"></canvas>

<script>
/* ---------------- SOUND ---------------- */
function sfx(t){
  try{
    let a=new(AudioContext),o=a.createOscillator(),g=a.createGain();
    o.type="square";
    let f={menu:500,start:700,hit:120,power:900,explosion:200}[t]||400;
    o.frequency.setValueAtTime(f,a.currentTime);
    g.gain.setValueAtTime(.15,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25);
  }catch(e){}
}

/* ---------------- CORE ---------------- */
const cv=document.getElementById("game"),ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;

let state="menu",paused=false;
let player={x:250,y:600,tx:250,ty:600,speed:8};
let hazards=[],powerups=[],particles=[],floatTexts=[];
let lastSpawn=0,spawnRate=700,speedMul=1;
let score=0,bonus=0,best=0,startTime=0;
let lastPower=0,powerRate=8000;
let shield=false,slow=false,slowEnd=0,slowF=1;
let fade=1,fadeTarget=0,fadeSpeed=.04;
let shakeX=0,shakeY=0,shakeMag=0;

/* ---------------- STARS ---------------- */
const starsFar=[],starsNear=[];
for(let i=0;i<80;i++)starsFar.push({x:Math.random()*500,y:Math.random()*700,s:.3+Math.random()*.4});
for(let i=0;i<60;i++)starsNear.push({x:Math.random()*500,y:Math.random()*700,s:.8+Math.random()*1.2});

function updateStars(){
  starsFar.forEach(s=>{s.y+=s.s*slowF*.4;if(s.y>700)s.y=0,s.x=Math.random()*500});
  starsNear.forEach(s=>{s.y+=s.s*slowF*.8;if(s.y>700)s.y=0,s.x=Math.random()*500});
}

function drawBackground(){
  let g=ctx.createLinearGradient(0,0,0,700);
  g.addColorStop(0,"#050816");g.addColorStop(1,"#020308");
  ctx.fillStyle=g;ctx.fillRect(0,0,500,700);

  ctx.fillStyle="#667";starsFar.forEach(s=>ctx.fillRect(s.x,s.y,2,2));
  ctx.fillStyle="#ccd";starsNear.forEach(s=>ctx.fillRect(s.x,s.y,2,2));
}

/* ---------------- SHIP ---------------- */
const ship=document.createElement("canvas");
ship.width=48;ship.height=48;
const sc=ship.getContext("2d");

(function(){
  sc.clearRect(0,0,48,48);
  let g=sc.createLinearGradient(24,4,24,44);
  g.addColorStop(0,"#d8dde4");g.addColorStop(.4,"#5f6f85");g.addColorStop(1,"#3c4756");
  sc.fillStyle=g;
  sc.beginPath();
  sc.moveTo(24,2);sc.lineTo(18,36);sc.lineTo(24,44);sc.lineTo(30,36);sc.closePath();sc.fill();

  sc.fillStyle="#5f6f85";
  sc.beginPath();sc.moveTo(18,22);sc.lineTo(6,28);sc.lineTo(4,34);sc.lineTo(14,38);sc.lineTo(18,34);sc.closePath();sc.fill();
  sc.beginPath();sc.moveTo(30,22);sc.lineTo(42,28);sc.lineTo(44,34);sc.lineTo(34,38);sc.lineTo(30,34);sc.closePath();sc.fill();

  sc.fillStyle="#7b8ba0";
  sc.beginPath();sc.moveTo(6,28);sc.lineTo(2,30);sc.lineTo(5,34);sc.lineTo(8,31);sc.closePath();sc.fill();
  sc.beginPath();sc.moveTo(42,28);sc.lineTo(46,30);sc.lineTo(43,34);sc.lineTo(40,31);sc.closePath();sc.fill();

  let cg=sc.createLinearGradient(20,15,28,21);
  cg.addColorStop(0,"#0a1a2e");cg.addColorStop(1,"#10263c");
  sc.fillStyle=cg;
  sc.beginPath();sc.moveTo(20,15);sc.lineTo(28,15);sc.lineTo(27,21);sc.lineTo(21,21);sc.closePath();sc.fill();

  sc.fillStyle="#6ffaff";sc.fillRect(21,16,1,1);sc.fillRect(23,17,1,1);
  sc.fillStyle="#fff";sc.fillRect(21,15,1,1);

  sc.fillStyle="#3c4756";
  sc.beginPath();sc.moveTo(18,36);sc.lineTo(30,36);sc.lineTo(32,40);sc.lineTo(16,40);sc.closePath();sc.fill();

  let tl=sc.createRadialGradient(19,42,1,19,42,6);
  tl.addColorStop(0,"#fff");tl.addColorStop(.4,"#00f5ff");tl.addColorStop(1,"rgba(0,255,255,0)");
  sc.fillStyle=tl;sc.beginPath();sc.arc(19,42,6,0,6.28);sc.fill();

  let tr=sc.createRadialGradient(29,42,1,29,42,6);
  tr.addColorStop(0,"#fff");tr.addColorStop(.4,"#00f5ff");tr.addColorStop(1,"rgba(0,255,255,0)");
  sc.fillStyle=tr;sc.beginPath();sc.arc(29,42,6,0,6.28);sc.fill();
})();

/* ---------------- THRUSTER ---------------- */
function thruster(){
  ctx.fillStyle="#fff";
  if(Math.random()>.5){
    ctx.fillRect(player.x-6+shakeX,player.y+18+shakeY,3,6);
    ctx.fillRect(player.x+3+shakeX,player.y+18+shakeY,3,6);
  }else{
    ctx.fillRect(player.x-5+shakeX,player.y+18+shakeY,2,5);
    ctx.fillRect(player.x+3+shakeX,player.y+18+shakeY,2,5);
  }
}
function trail(){
  for(let i=0;i<6;i++){
    let ox=(Math.random()-.5)*18,oy=10+Math.random()*20;
    ctx.fillStyle=Math.random()>.5?"#00f0ff":"#c0ffff";
    ctx.fillRect(player.x-1+ox+shakeX,player.y+oy+shakeY,2,2);
  }
}

/* ---------------- SHIELD ---------------- */
let sp=0,sd=1;
function drawShield(){
  if(!shield)return;
  sp+=.08*sd;if(sp>2)sd=-1;if(sp<-2)sd=1;
  let r=34+sp;
  let g=ctx.createRadialGradient(player.x+shakeX,player.y+shakeY,r*.4,player.x+shakeX,player.y+shakeY,r);
  g.addColorStop(0,"rgba(0,255,255,.25)");
  g.addColorStop(1,"rgba(0,255,255,0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(player.x+shakeX,player.y+shakeY,r,0,6.28);ctx.fill();
  ctx.strokeStyle="rgba(0,255,255,.8)";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(player.x+shakeX,player.y+shakeY,r*.75,0,6.28);ctx.stroke();
}

/* ---------------- ASTEROIDS ---------------- */
function makeAst(s){
  let c=document.createElement("canvas");c.width=s;c.height=s;
  let a=c.getContext("2d");
  a.fillStyle="#aa7744";a.strokeStyle="#553322";a.lineWidth=s*.08;
  a.beginPath();
  let pts=7+Math.floor(Math.random()*4),r=s/2;
  for(let i=0;i<pts;i++){
    let ang=(6.28*i)/pts,w=r*(.7+Math.random()*.3);
    let X=r+Math.cos(ang)*w,Y=r+Math.sin(ang)*w;
    if(i==0)a.moveTo(X,Y);else a.lineTo(X,Y);
  }
  a.closePath();a.fill();a.stroke();
  return c;
}
function makePower(t){
  let c=document.createElement("canvas");c.width=32;c.height=32;
  let p=c.getContext("2d");
  let col=t=="shield"?"#4ecbff":t=="slowmo"?"#6dff6d":"#ffd84e";
  let g=p.createRadialGradient(16,16,4,16,16,14);
  g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");
  p.fillStyle=g;p.beginPath();p.arc(16,16,14,0,6.28);p.fill();
  p.fillStyle="#fff";p.fillRect(13,13,6,6);
  return c;
}
function spawnHaz(){
  let s=40+Math.random()*60;
  hazards.push({x:Math.random()*(500-s),y:-s,s:s,v:(3+Math.random()*4)*speedMul,sp:makeAst(s)});
}
function spawnPow(){
  let t=["shield","slowmo","score"][Math.floor(Math.random()*3)];
  powerups.push({x:Math.random()*468,y:-32,s:32,v:1.2+Math.random()*1.2,t:t,sp:makePower(t)});
}

/* ---------------- PARTICLES ---------------- */
function boom(x,y,col){
  for(let i=0;i<24;i++){
    let a=Math.random()*6.28,sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:400+Math.random()*300,born:performance.now(),col});
  }
}
function updParts(){
  let n=performance.now();
  particles=particles.filter(p=>{
    let t=n-p.born;p.x+=p.vx;p.y+=p.vy;p.vy+=.02;
    return t<p.life;
  });
}
function drawParts(){
  let n=performance.now();
  particles.forEach(p=>{
    let t=n-p.born,a=1-t/p.life;
    ctx.fillStyle=`rgba(${p.col},${a})`;
    ctx.fillRect(p.x+shakeX,p.y+shakeY,3,3);
  });
}

/* ---------------- FLOAT TEXT ---------------- */
function floatTxt(t,x,y,col){
  F.push({t,x,y,a:1,life:1000,start:performance.now(),col:col||"255,255,0"});
}
function updFloat(){
  let n=performance.now();
  F=F.filter(f=>{
    let e=n-f.start;f.y-=.3;f.a=1-e/f.life;return e<f.life;
  });
}
function drawFloat(){
  ctx.font="14px PressStart";ctx.textAlign="center";
  F.forEach(f=>{
    ctx.fillStyle=`rgba(${f.col},${f.a})`;
    ctx.fillText(f.t,f.x+shakeX,f.y+shakeY);
  });
}

/* ---------------- INPUT ---------------- */
const keys={};
onkeydown=e=>{
  let k=e.key.toLowerCase();keys[k]=true;
  if(k=="p"&&state=="game")paused=!paused;
  if(e.code=="Space"){
    if(state=="menu"){sfx("start");startGame();}
    else if(state=="gameover"){sfx("start");startGame();}
  }
  if(k=="m"&&state=="gameover"){state="menu";fade=1;fadeTarget=0;}
};
onkeyup=e=>keys[e.key.toLowerCase()]=false;
cv.onmousemove=e=>{
  let r=cv.getBoundingClientRect();
  player.tx=e.clientX-r.left;player.ty=e.clientY-r.top;
};

/* ---------------- PLAYER ---------------- */
function updPlayer(){
  if(keys["a"]||keys["arrowleft"])player.tx-=player.speed;
  if(keys["d"]||keys["arrowright"])player.tx+=player.speed;
  if(keys["w"]||keys["arrowup"])player.ty-=player.speed;
  if(keys["s"]||keys["arrowdown"])player.ty+=player.speed;

  player.tx=Math.max(20,Math.min(480,player.tx));
  player.ty=Math.max(20,Math.min(680,player.ty));

  player.x+=(player.tx-player.x)*.25;
  player.y+=(player.ty-player.y)*.25;
}

/* ---------------- GAME CONTROL ---------------- */
function startGame(){
  state="game";paused=false;
  hazards=[];powerups=[];particles=[];F=[];
  score=0;bonus=0;speedMul=1;spawnRate=700;
  startTime=performance.now();lastSpawn=0;lastPower=0;
  shield=false;slow=false;slowF=1;
  player.x=250;player.y=600;player.tx=250;player.ty=600;
  fade=1;fadeTarget=0;
}

/* ---------------- UPDATE ---------------- */
function update(){
  if(state!="game"||paused)return;

  updateStars();updPlayer();updParts();updFloat();

  let n=performance.now();
  score=Math.floor((n-startTime)/100)+bonus;

  if(slow&&n>slowEnd){slow=false;slowF=1;}

  if(score>0&&score%80==0){
    speedMul=1+score/400;
    spawnRate=Math.max(180,700-score*2);
  }

  if(n-lastSpawn>spawnRate){spawnHaz();lastSpawn=n;}
  if(n-lastPower>powerRate){if(Math.random()<.7)spawnPow();lastPower=n;}

  hazards.forEach(h=>h.y+=h.v*slowF);
  powerups.forEach(p=>p.y+=p.v*slowF);

  for(let h of hazards){
    let dx=h.x+h.s/2-player.x,dy=h.y+h.s/2-player.y;
    if(Math.hypot(dx,dy)<20+h.s/2){
      if(shield){
        shield=false;boom(h.x+h.s/2,h.y+h.s/2,"255,200,80");
        hazards=hazards.filter(z=>z!==h);sfx("power");
        shakeMag=10;floatTxt("BLOCKED!",player.x,player.y-40,"0,255,255");
        break;
      }else{
        sfx("hit");boom(player.x,player.y,"255,80,80");
        shakeMag=18;state="gameover";best=Math.max(best,score);
        fadeTarget=.7;break;
      }
    }
  }

  for(let p of powerups){
    let dx=p.x+p.s/2-player.x,dy=p.y+p.s/2-player.y;
    if(Math.hypot(dx,dy)<26+p.s/2){
      sfx("power");
      if(p.t=="shield"){shield=true;floatTxt("SHIELD",player.x,player.y-40,"0,255,255");}
      else if(p.t=="slowmo"){slow=true;slowF=.4;slowEnd=performance.now()+5000;floatTxt("SLOW-MO",player.x,player.y-40,"100,255,100");}
      else{bonus+=500;floatTxt("+500",player.x,player.y-40,"255,255,0");}
      powerups=powerups.filter(z=>z!==p);shakeMag=6;break;
    }
  }

  hazards=hazards.filter(h=>h.y<820);
  powerups=powerups.filter(p=>p.y<740);

  if(shakeMag>0){
    shakeMag*=.85;
    shakeX=(Math.random()-.5)*shakeMag;
    shakeY=(Math.random()-.5)*shakeMag;
  }else shakeX=shakeY=0;
}

/* ---------------- DRAW ---------------- */
function drawMenu(){
  drawBackground();
  ctx.save();ctx.translate(shakeX,shakeY);

  ctx.textAlign="center";
  ctx.font="36px PressStart"; /* BIGGER TITLE */
  ctx.fillStyle="#0ff";ctx.shadowColor="#0ff";ctx.shadowBlur=18;
  ctx.fillText("METEOR",250,ctx.fillText("METEOR",250,200);
  ctx.fillText("SHOWER",250,250);
  ctx.shadowBlur=0;

  ctx.font="16px PressStart";
  ctx.fillStyle="#ff00ff";
  ctx.fillText("PRESS SPACE TO PLAY",250,330);

  ctx.font="12px PressStart";
  ctx.fillStyle="#ffff00";
  ctx.fillText("WASD / ARROWS / MOUSE",250,380);
  ctx.fillText("P = PAUSE",250,410);

  if(best>0){
    ctx.fillStyle="#ffea00";
    ctx.fillText("BEST: "+best,250,460);
  }

  ctx.restore();
}

function drawGame(){
  drawBackground();
  ctx.save();
  ctx.translate(shakeX,shakeY);

  drawShield();
  trail();
  thruster();
  ctx.drawImage(ship,player.x-24,player.y-24,48,48);

  hazards.forEach(h=>ctx.drawImage(h.sp,h.x+shakeX,h.y+shakeY,h.s,h.s));
  powerups.forEach(p=>ctx.drawImage(p.sp,p.x+shakeX,p.y+shakeY,p.s,p.s));

  drawParts();
  drawFloat();

  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.font="14px PressStart";
  ctx.fillText("SCORE: "+score,10,30);
  ctx.fillText("BEST: "+best,10,55);

  let y=90;
  ctx.font="12px PressStart";
  if(shield){ctx.fillStyle="#4ecbff";ctx.fillText("SHIELD",10,y);y+=18;}
  if(slow){ctx.fillStyle="#6dff6d";ctx.fillText("SLOW-MO",10,y);y+=18;}

  if(paused){
    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(0,0,500,700);
    ctx.fillStyle="#ffff00";
    ctx.font="24px PressStart";
    ctx.textAlign="center";
    ctx.fillText("PAUSED",250,350);
  }
}

function drawGameOver(){
  drawBackground();
  ctx.save();
  ctx.translate(shakeX,shakeY);

  ctx.textAlign="center";
  ctx.fillStyle="#ff0040";
  ctx.font="32px PressStart";
  ctx.fillText("METEOR SHOWER",250,200);
  ctx.fillText("GAME OVER",250,260);

  ctx.font="18px PressStart";
  ctx.fillStyle="#0ff";
  ctx.fillText("SCORE: "+score,250,330);
  ctx.fillText("BEST: "+best,250,370);

  ctx.fillStyle="#ffff00";
  ctx.font="14px PressStart";
  ctx.fillText("SPACE = RETRY",250,440);
  ctx.fillText("M = MENU",250,470);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,500,700);

  if(state=="menu")drawMenu();
  else if(state=="game")drawGame();
  else if(state=="gameover")drawGameOver();

  if(fade!=fadeTarget){
    fade += (fadeTarget - fade)*fadeSpeed;
  }
  if(fade>0){
    ctx.fillStyle=`rgba(0,0,0,${fade})`;
    ctx.fillRect(0,0,500,700);
  }
}

function loop(){
  if(!paused)update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
