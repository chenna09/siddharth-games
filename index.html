<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>meteor shower</title>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Courier New", monospace;
      position: fixed;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
      );
      z-index: 10;
    }
    #game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }
    canvas {
      background: #000;
      border: 4px solid #0ff;
      box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    @font-face {
      font-family: "PressStart";
      src: url("https://fonts.gstatic.com/s/pressstart2p/v9/e3t4euO8T-267oIAQAu6jDQyK3nY.ttf");
      font-display: swap;
    }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
</div>

<script>
/* ====== MOBILE DETECTION & CONFIG ====== */
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isAndroid = /Android/.test(navigator.userAgent);

/* ====== CANVAS SETUP ====== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
ctx.imageSmoothingEnabled = false;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const container = document.getElementById("game-container");
  const maxWidth = container.clientWidth;
  const maxHeight = container.clientHeight;
  
  // Aspect ratio: 500x700 = 5:7
  let width = maxWidth;
  let height = (width / 5) * 7;
  
  if (height > maxHeight) {
    height = maxHeight;
    width = (height / 7) * 5;
  }
  
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = false;
  
  GAME_WIDTH = width;
  GAME_HEIGHT = height;
}

let GAME_WIDTH = 500;
let GAME_HEIGHT = 700;

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ====== SIMPLE SFX ====== */
function sfx(type) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "square";
    if (type === "menu") o.frequency.setValueAtTime(500, ac.currentTime);
    if (type === "start") o.frequency.setValueAtTime(700, ac.currentTime);
    if (type === "hit") o.frequency.setValueAtTime(120, ac.currentTime);
    if (type === "power") o.frequency.setValueAtTime(900, ac.currentTime);
    if (type === "explosion") o.frequency.setValueAtTime(200, ac.currentTime);
    g.gain.setValueAtTime(0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + 0.25);
  } catch (e) {}
}

/* ====== CORE STATE ====== */
let state = "menu"; // menu, game, gameover
let paused = false;

let player = {
  x: GAME_WIDTH / 2,
  y: GAME_HEIGHT - 100,
  tx: GAME_WIDTH / 2,
  ty: GAME_HEIGHT - 100,
  speed: 8
};

let hazards = [];
let powerups = [];
let particles = [];
let floatTexts = [];

let lastSpawn = 0;
let spawnRate = 700;
let speedMultiplier = 1.0;

let score = 0;
let bonusScore = 0;
let bestScore = 0;
let startTime = 0;

let lastPowerup = 0;
let powerupRate = 8000;

let shieldActive = false;
let slowmoActive = false;
let slowmoEndTime = 0;
let slowmoFactor = 1;

let fadeAlpha = 1;
let fadeTarget = 0;
let fadeSpeed = 0.04;

let shakeX = 0, shakeY = 0, shakeMag = 0;

/* ====== TOUCH INPUT ====== */
let touchPos = { x: GAME_WIDTH / 2, y: GAME_HEIGHT - 100 };
let isGameStarted = false;

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (!isMobile) return;
  
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  
  if (e.touches.length > 0) {
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) / (rect.width / GAME_WIDTH);
    const y = (touch.clientY - rect.top) / (rect.height / GAME_HEIGHT);
    
    touchPos.x = Math.max(20, Math.min(GAME_WIDTH - 20, x));
    touchPos.y = Math.max(20, Math.min(GAME_HEIGHT - 20, y));
    player.tx = touchPos.x;
    player.ty = touchPos.y;
    
    // Start game on first tap in menu
    if (state === "menu" && !isGameStarted) {
      isGameStarted = true;
      sfx("start");
      startGame();
    }
  }
});

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (!isMobile || state !== "game") return;
  
  const rect = canvas.getBoundingClientRect();
  
  if (e.touches.length > 0) {
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) / (rect.width / GAME_WIDTH);
    const y = (touch.clientY - rect.top) / (rect.height / GAME_HEIGHT);
    
    touchPos.x = Math.max(20, Math.min(GAME_WIDTH - 20, x));
    touchPos.y = Math.max(20, Math.min(GAME_HEIGHT - 20, y));
    player.tx = touchPos.x;
    player.ty = touchPos.y;
  }
});

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
});

/* ====== BACKGROUND (PARALLAX + NEBULA) ====== */
const starsFar = [];
const starsNear = [];
for (let i = 0; i < 80; i++) {
  starsFar.push({
    x: Math.random() * GAME_WIDTH,
    y: Math.random() * GAME_HEIGHT,
    s: 0.3 + Math.random() * 0.4
  });
}
for (let i = 0; i < 60; i++) {
  starsNear.push({
    x: Math.random() * GAME_WIDTH,
    y: Math.random() * GAME_HEIGHT,
    s: 0.8 + Math.random() * 1.2
  });
}

function updateStars() {
  starsFar.forEach((s) => {
    s.y += s.s * slowmoFactor * 0.4;
    if (s.y > GAME_HEIGHT) {
      s.y = 0;
      s.x = Math.random() * GAME_WIDTH;
    }
  });
  starsNear.forEach((s) => {
    s.y += s.s * slowmoFactor * 0.8;
    if (s.y > GAME_HEIGHT) {
      s.y = 0;
      s.x = Math.random() * GAME_WIDTH;
    }
  });
}

function drawBackground() {
  let g = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
  g.addColorStop(0, "#050816");
  g.addColorStop(0.5, "#050b1f");
  g.addColorStop(1, "#020308");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.fillStyle = "#334";
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.ellipse(120, 200, 180, 80, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(380, 420, 220, 90, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#667";
  starsFar.forEach((s) => ctx.fillRect(s.x, s.y, 2, 2));
  ctx.fillStyle = "#ccd";
  starsNear.forEach((s) => ctx.fillRect(s.x, s.y, 2, 2));
}

/* ====== SHIP SPRITE ====== */
const ship = document.createElement("canvas");
ship.width = 48;
ship.height = 48;
const sc = ship.getContext("2d");
(function () {
  sc.clearRect(0, 0, 48, 48);
  let g = sc.createLinearGradient(24, 4, 24, 44);
  g.addColorStop(0, "#d8dde4");
  g.addColorStop(0.4, "#5f6f85");
  g.addColorStop(1, "#3c4756");
  sc.fillStyle = g;
  sc.beginPath();
  sc.moveTo(24, 2);
  sc.lineTo(18, 36);
  sc.lineTo(24, 44);
  sc.lineTo(30, 36);
  sc.closePath();
  sc.fill();

  sc.fillStyle = "#5f6f85";
  sc.beginPath();
  sc.moveTo(18, 22);
  sc.lineTo(6, 28);
  sc.lineTo(4, 34);
  sc.lineTo(14, 38);
  sc.lineTo(18, 34);
  sc.closePath();
  sc.fill();
  sc.beginPath();
  sc.moveTo(30, 22);
  sc.lineTo(42, 28);
  sc.lineTo(44, 34);
  sc.lineTo(34, 38);
  sc.lineTo(30, 34);
  sc.closePath();
  sc.fill();

  sc.fillStyle = "#7b8ba0";
  sc.beginPath();
  sc.moveTo(6, 28);
  sc.lineTo(2, 30);
  sc.lineTo(5, 34);
  sc.lineTo(8, 31);
  sc.closePath();
  sc.fill();
  sc.beginPath();
  sc.moveTo(42, 28);
  sc.lineTo(46, 30);
  sc.lineTo(43, 34);
  sc.lineTo(40, 31);
  sc.closePath();
  sc.fill();

  let cg = sc.createLinearGradient(20, 15, 28, 21);
  cg.addColorStop(0, "#0a1a2e");
  cg.addColorStop(1, "#10263c");
  sc.fillStyle = cg;
  sc.beginPath();
  sc.moveTo(20, 15);
  sc.lineTo(28, 15);
  sc.lineTo(27, 21);
  sc.lineTo(21, 21);
  sc.closePath();
  sc.fill();
  sc.fillStyle = "#6ffaff";
  sc.fillRect(21, 16, 1, 1);
  sc.fillRect(23, 17, 1, 1);
  sc.fillStyle = "#ffffff";
  sc.fillRect(21, 15, 1, 1);

  sc.fillStyle = "#3c4756";
  sc.beginPath();
  sc.moveTo(18, 36);
  sc.lineTo(30, 36);
  sc.lineTo(32, 40);
  sc.lineTo(16, 40);
  sc.closePath();
  sc.fill();

  let tl = sc.createRadialGradient(19, 42, 1, 19, 42, 6);
  tl.addColorStop(0, "#ffffff");
  tl.addColorStop(0.4, "#00f5ff");
  tl.addColorStop(1, "rgba(0,255,255,0)");
  sc.fillStyle = tl;
  sc.beginPath();
  sc.arc(19, 42, 6, 0, Math.PI * 2);
  sc.fill();
  let tr = sc.createRadialGradient(29, 42, 1, 29, 42, 6);
  tr.addColorStop(0, "#ffffff");
  tr.addColorStop(0.4, "#00f5ff");
  tr.addColorStop(1, "rgba(0,255,255,0)");
  sc.fillStyle = tr;
  sc.beginPath();
  sc.arc(29, 42, 6, 0, Math.PI * 2);
  sc.fill();
})();

function drawThruster() {
  ctx.fillStyle = "#ffffff";
  if (Math.random() > 0.5) {
    ctx.fillRect(player.x - 6 + shakeX, player.y + 18 + shakeY, 3, 6);
    ctx.fillRect(player.x + 3 + shakeX, player.y + 18 + shakeY, 3, 6);
  } else {
    ctx.fillRect(player.x - 5 + shakeX, player.y + 18 + shakeY, 2, 5);
    ctx.fillRect(player.x + 3 + shakeX, player.y + 18 + shakeY, 2, 5);
  }
}

function drawEngineTrail() {
  for (let i = 0; i < 6; i++) {
    const ox = (Math.random() - 0.5) * 18;
    const oy = 10 + Math.random() * 20;
    ctx.fillStyle = Math.random() > 0.5 ? "#00f0ff" : "#c0ffff";
    ctx.fillRect(player.x - 1 + ox + shakeX, player.y + oy + shakeY, 2, 2);
  }
}

/* ====== SHIELD ====== */
let shieldPulse = 0, shieldDir = 1;

function drawShield() {
  if (!shieldActive) return;
  shieldPulse += 0.08 * shieldDir;
  if (shieldPulse > 2) shieldDir = -1;
  if (shieldPulse < -2) shieldDir = 1;
  const r = 34 + shieldPulse;
  let g = ctx.createRadialGradient(
    player.x + shakeX,
    player.y + shakeY,
    r * 0.4,
    player.x + shakeX,
    player.y + shakeY,
    r
  );
  g.addColorStop(0, "rgba(0,255,255,0.25)");
  g.addColorStop(1, "rgba(0,255,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(player.x + shakeX, player.y + shakeY, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,255,255,0.8)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x + shakeX, player.y + shakeY, r * 0.75, 0, Math.PI * 2);
  ctx.stroke();
}

/* ====== ASTEROIDS & POWERUPS ====== */
function createAsteroid(size) {
  const c = document.createElement("canvas");
  c.width = size;
  c.height = size;
  const a = c.getContext("2d");
  a.fillStyle = "#aa7744";
  a.strokeStyle = "#553322";
  a.lineWidth = size * 0.08;
  a.beginPath();
  const points = 7 + Math.floor(Math.random() * 4);
  const r = size / 2;
  for (let i = 0; i < points; i++) {
    const ang = (Math.PI * 2 * i) / points;
    const wob = r * (0.7 + Math.random() * 0.3);
    const x = r + Math.cos(ang) * wob;
    const y = r + Math.sin(ang) * wob;
    if (i === 0) a.moveTo(x, y);
    else a.lineTo(x, y);
  }
  a.closePath();
  a.fill();
  a.stroke();
  return c;
}

function createPowerSprite(type) {
  const c = document.createElement("canvas");
  c.width = 32;
  c.height = 32;
  const p = c.getContext("2d");
  let col = type === "shield" ? "#4ecbff" : type === "slowmo" ? "#6dff6d" : "#ffd84e";
  let g = p.createRadialGradient(16, 16, 4, 16, 16, 14);
  g.addColorStop(0, col);
  g.addColorStop(1, "rgba(0,0,0,0)");
  p.fillStyle = g;
  p.beginPath();
  p.arc(16, 16, 14, 0, Math.PI * 2);
  p.fill();
  p.fillStyle = "#ffffff";
  p.fillRect(13, 13, 6, 6);
  return c;
}

function spawnHazard() {
  sfx("spawn");
  const size = 40 + Math.random() * 60;
  hazards.push({
    x: Math.random() * (GAME_WIDTH - size),
    y: -size,
    size: size,
    speed: (3 + Math.random() * 4) * speedMultiplier,
    sprite: createAsteroid(size)
  });
}

function spawnPowerup() {
  const types = ["shield", "slowmo", "score"];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({
    x: Math.random() * (GAME_WIDTH - 32),
    y: -32,
    size: 32,
    speed: 1.2 + Math.random() * 1.2,
    type: type,
    sprite: createPowerSprite(type)
  });
}

/* ====== PARTICLES (EXPLOSIONS) ====== */
function spawnExplosion(x, y, color) {
  for (let i = 0; i < 24; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 400 + Math.random() * 300,
      born: performance.now(),
      color: color
    });
  }
}

function updateParticles() {
  const now = performance.now();
  particles = particles.filter((p) => {
    const t = now - p.born;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    return t < p.life;
  });
}

function drawParticles() {
  const now = performance.now();
  particles.forEach((p) => {
    const t = now - p.born;
    const a = 1 - t / p.life;
    ctx.fillStyle = `rgba(${p.color},${a})`;
    ctx.fillRect(p.x + shakeX, p.y + shakeY, 3, 3);
  });
}

/* ====== FLOATING TEXT ====== */
function spawnFloat(text, x, y, color) {
  floatTexts.push({
    text: text,
    x: x,
    y: y,
    alpha: 1,
    life: 1000,
    start: performance.now(),
    color: color || "255,255,0"
  });
}

function updateFloatTexts() {
  const now = performance.now();
  floatTexts = floatTexts.filter((t) => {
    const e = now - t.start;
    t.y -= 0.3;
    t.alpha = 1 - e / t.life;
    return e < t.life;
  });
}

function drawFloatTexts() {
  ctx.font = "14px PressStart";
  ctx.textAlign = "center";
  floatTexts.forEach((t) => {
    ctx.fillStyle = `rgba(${t.color},${t.alpha})`;
    ctx.fillText(t.text, t.x + shakeX, t.y + shakeY);
  });
}

/* ====== KEYBOARD INPUT (For non-mobile) ====== */
const keys = {};
window.addEventListener("keydown", (e) => {
  if (isMobile) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "p" && state === "game") paused = !paused;
  if (e.code === "Space") {
    if (state === "menu") {
      sfx("start");
      startGame();
    } else if (state === "gameover") {
      sfx("start");
      startGame();
    }
  }
  if (k === "m" && state === "gameover") {
    state = "menu";
    fadeTarget = 0;
    fadeAlpha = 1;
  }
});

window.addEventListener("keyup", (e) => {
  if (isMobile) return;
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", (e) => {
  if (isMobile) return;
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / (r.width / GAME_WIDTH);
  const my = (e.clientY - r.top) / (r.height / GAME_HEIGHT);
  player.tx = mx;
  player.ty = my;
});

/* ====== PLAYER MOVEMENT (SMOOTH) ====== */
function updatePlayer() {
  if (!isMobile) {
    if (keys["arrowleft"] || keys["a"]) player.tx -= player.speed;
    if (keys["arrowright"] || keys["d"]) player.tx += player.speed;
    if (keys["arrowup"] || keys["w"]) player.ty -= player.speed;
    if (keys["arrowdown"] || keys["s"]) player.ty += player.speed;
  }

  player.tx = Math.max(20, Math.min(GAME_WIDTH - 20, player.tx));
  player.ty = Math.max(20, Math.min(GAME_HEIGHT - 20, player.ty));

  player.x += (player.tx - player.x) * 0.25;
  player.y += (player.ty - player.y) * 0.25;
}

/* ====== GAME CONTROL ====== */
function startGame() {
  state = "game";
  paused = false;
  hazards = [];
  powerups = [];
  particles = [];
  floatTexts = [];
  score = 0;
  bonusScore = 0;
  speedMultiplier = 1.0;
  spawnRate = 700;
  startTime = performance.now();
  lastSpawn = 0;
  lastPowerup = 0;
  shieldActive = false;
  slowmoActive = false;
  slowmoFactor = 1;
  player.x = GAME_WIDTH / 2;
  player.y = GAME_HEIGHT - 100;
  player.tx = player.x;
  player.ty = player.y;
  fadeAlpha = 1;
  fadeTarget = 0;
  isGameStarted = false;
}

/* ====== UPDATE LOOP ====== */
function update() {
  if (state !== "game" || paused) return;

  updateStars();
  updatePlayer();
  updateParticles();
  updateFloatTexts();

  const now = performance.now();
  const timeScore = Math.floor((now - startTime) / 100);
  score = timeScore + bonusScore;

  if (slowmoActive && now > slowmoEndTime) {
    slowmoActive = false;
    slowmoFactor = 1;
  }

  if (score > 0 && score % 80 === 0) {
    speedMultiplier = 1.0 + score / 400;
    spawnRate = Math.max(180, 700 - score * 2);
  }

  if (now - lastSpawn > spawnRate) {
    spawnHazard();
    lastSpawn = now;
  }

  if (now - lastPowerup > powerupRate) {
    if (Math.random() < 0.7) spawnPowerup();
    lastPowerup = now;
  }

  hazards.forEach((h) => (h.y += h.speed * slowmoFactor));
  powerups.forEach((p) => (p.y += p.speed * slowmoFactor));

  for (let h of hazards) {
    const dx = h.x + h.size / 2 - player.x;
    const dy = h.y + h.size / 2 - player.y;
    if (Math.hypot(dx, dy) < 20 + h.size / 2) {
      if (shieldActive) {
        shieldActive = false;
        spawnExplosion(h.x + h.size / 2, h.y + h.size / 2, "255,200,80");
        hazards = hazards.filter((x) => x !== h);
        sfx("power");
        shakeMag = 10;
        spawnFloat("BLOCKED!", player.x, player.y - 40, "0,255,255");
        break;
      } else {
        sfx("hit");
        spawnExplosion(player.x, player.y, "255,80,80");
        shakeMag = 18;
        state = "gameover";
        bestScore = Math.max(bestScore, score);
        fadeTarget = 0.7;
        break;
      }
    }
  }

  for (let p of powerups) {
    const dx = p.x + p.size / 2 - player.x;
    const dy = p.y + p.size / 2 - player.y;
    if (Math.hypot(dx, dy) < 26 + p.size / 2) {
      sfx("power");
      if (p.type === "shield") {
        shieldActive = true;
        spawnFloat("SHIELD", player.x, player.y - 40, "0,255,255");
      } else if (p.type === "slowmo") {
        slowmoActive = true;
        slowmoFactor = 0.4;
        slowmoEndTime = performance.now() + 5000;
        spawnFloat("SLOW-MO", player.x, player.y - 40, "100,255,100");
      } else if (p.type === "score") {
        bonusScore += 500;
        spawnFloat("+500", player.x, player.y - 40, "255,255,0");
      }
      powerups = powerups.filter((x) => x !== p);
      shakeMag = 6;
      break;
    }
  }

  hazards = hazards.filter((h) => h.y < GAME_HEIGHT + 120);
  powerups = powerups.filter((p) => p.y < GAME_HEIGHT + 40);

  if (shakeMag > 0) {
    shakeMag *= 0.85;
    shakeX = (Math.random() - 0.5) * shakeMag;
    shakeY = (Math.random() - 0.5) * shakeMag;
  } else {
    shakeX = 0;
    shakeY = 0;
  }
}

/* ====== DRAWING ====== */
function drawMenu() {
  drawBackground();
  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.textAlign = "center";
  ctx.font = "28px PressStart";
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 18;
  ctx.fillText("THE LAST DOT", GAME_WIDTH / 2, 210);
  ctx.fillText("STANDING", GAME_WIDTH / 2, 260);
  ctx.shadowBlur = 0;

  ctx.font = "16px PressStart";
  ctx.fillStyle = "#ff00ff";
  const tapText = isMobile ? "TAP TO PLAY" : "PRESS SPACE TO PLAY";
  ctx.fillText(tapText, GAME_WIDTH / 2, 330);

  ctx.font = "12px PressStart";
  ctx.fillStyle = "#ffff00";
  if (!isMobile) {
    ctx.fillText("WASD / ARROWS / MOUSE", GAME_WIDTH / 2, 380);
    ctx.fillText("P = PAUSE", GAME_WIDTH / 2, 410);
  } else {
    ctx.fillText("DRAG YOUR FINGER", GAME_WIDTH / 2, 380);
    ctx.fillText("TO MOVE", GAME_WIDTH / 2, 410);
  }

  if (bestScore > 0) {
    ctx.fillStyle = "#ffea00";
    ctx.fillText("BEST: " + bestScore, GAME_WIDTH / 2, 460);
  }

  ctx.restore();
}

function drawGame() {
  drawBackground();
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawShield();
  drawEngineTrail();
  drawThruster();
  ctx.drawImage(ship, player.x - 24, player.y - 24, 48, 48);

  hazards.forEach((h) => ctx.drawImage(h.sprite, h.x + shakeX, h.y + shakeY, h.size, h.size));
  powerups.forEach((p) => ctx.drawImage(p.sprite, p.x + shakeX, p.y + shakeY, p.size, p.size));

  drawParticles();
  drawFloatTexts();

  ctx.restore();

  ctx.fillStyle = "#ffffff";
  ctx.font = "14px PressStart";
  ctx.textAlign = "left";
  ctx.fillText("SCORE: " + score, 10, 30);
  ctx.fillText("BEST: " + bestScore, 10, 55);

  let uiX = 10,
    uiY = 90;
  ctx.font = "12px PressStart";
  if (shieldActive) {
    ctx.fillStyle = "#4ecbff";
    ctx.fillText("SHIELD", uiX, uiY);
    uiY += 18;
  }
  if (slowmoActive) {
    ctx.fillStyle = "#6dff6d";
    ctx.fillText("SLOW-MO", uiX, uiY);
    uiY += 18;
  }

  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.fillStyle = "#ffff00";
    ctx.font = "24px PressStart";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", GAME_WIDTH / 2, GAME_HEIGHT / 2);
  }
}

function drawGameOver() {
  drawBackground();
  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ff0040";
  ctx.font = "32px PressStart";
  ctx.fillText("GAME OVER", GAME_WIDTH / 2, 260);

  ctx.font = "18px PressStart";
  ctx.fillStyle = "#0ff";
  ctx.fillText("SCORE: " + score, GAME_WIDTH / 2, 320);
  ctx.fillText("BEST: " + bestScore, GAME_WIDTH / 2, 355);

  ctx.fillStyle = "#ffff00";
  ctx.font = "14px PressStart";
  const retryText = isMobile ? "TAP TO RETRY" : "SPACE = RETRY";
  ctx.fillText(retryText, GAME_WIDTH / 2, 420);
  if (!isMobile) {
    ctx.fillText("M = MENU", GAME_WIDTH / 2, 450);
  }

  ctx.restore();
}

/* ====== FADE & MAIN DRAW ====== */
function draw() {
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  if (state === "menu") drawMenu();
  else if (state === "game") drawGame();
  else if (state === "gameover") drawGameOver();

  if (fadeAlpha !== fadeTarget) {
    if (fadeAlpha < fadeTarget)
      fadeAlpha = Math.min(fadeTarget, fadeAlpha + fadeSpeed);
    else fadeAlpha = Math.max(fadeTarget, fadeAlpha - fadeSpeed);
  }
  if (fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  }
}

/* ====== LOOP ====== */
function loop() {
  if (!paused) update();
  draw();
  requestAnimationFrame(loop);
}

// Prevent context menu on long press
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// Prevent accidental zoom
document.addEventListener("gesturestart", (e) => e.preventDefault());

loop();
</script>
</body>
